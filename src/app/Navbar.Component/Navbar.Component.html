#<nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
  <div class="container-fluid px-3 px-md-4">
    
    <!-- 1. Logo (Extrema izquierda) -->
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <img src="/images/payiboxlogo2.png" alt="Logo Payibox" class="brand-logo me-2">
      <span class="brand-text fw-bold">PAYIBOX</span>
    </a>

    <!-- 2. Botón Hamburguesa (Extrema derecha) -->
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- 3. Todo el menú colapsable -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto gap-3 align-items-start align-items-lg-center py-3 py-lg-0">
        
        <!-- Enlaces directos -->
        <li class="nav-item">
          <a class="nav-link px-3 text-uppercase" routerLink="/store">Tienda</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3 text-uppercase" routerLink="/nosotros">Nosotros</a>
        </li>

        <!-- Carrito -->
        <li class="nav-item px-3">
          <a routerLink="/car" class="nav-link d-flex align-items-center gap-2 p-0">
            <div class="position-relative d-inline-block">
              <i class="bi bi-cart3" style="font-size: 1.4rem;"></i>
              <span *ngIf="cartService.items().length > 0"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark"
                style="font-size: 0.55rem; padding: 0.35em 0.5em;">
                {{ cartService.items().length }}
              </span>
            </div>
            <span class="text-uppercase ms-1">Carrito</span>
          </a>
        </li>

        <!-- Línea divisoria en móviles -->
        <hr class="border-secondary my-1 w-100 d-lg-none">

        <!-- Sesión / Perfil de Usuario -->
        <li class="nav-item px-3 w-100 w-lg-auto">
          @if (authService.currentUser()) {
          <div class="dropdown">
            <button class="btn btn-outline-warning dropdown-toggle d-flex align-items-center gap-2 border-0 p-0" type="button"
              id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
              <span class="text-white text-capitalize small">{{ authService.currentUser()?.username }}</span>
              <i class="bi bi-person-circle fs-4 text-warning"></i>
            </button>

            <ul class="dropdown-menu dropdown-menu-end bg-dark border-secondary shadow mt-2" aria-labelledby="userDropdown">
              <li>
                <a class="dropdown-item text-light py-2 d-flex align-items-center" routerLink="/perfil">
                  <i class="bi bi-person me-2"></i>Mi Perfil
                </a>
              </li>
              <li>
                <hr class="dropdown-divider border-secondary">
              </li>
              <li>
                <button class="dropdown-item text-danger py-2 d-flex align-items-center" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                </button>
              </li>
            </ul>
          </div>
          } @else {
          <a class="btn btn-payibox-login text-dark fw-bold px-4 py-2 text-center d-inline-block w-100 w-lg-auto" routerLink="/login">
            Iniciar Sesión
          </a>
          }
        </li>

      </ul>
    </div>

  </div>
</nav>
