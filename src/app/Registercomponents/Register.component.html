<div class="login-wrapper">
  <div class="login-container">
    <div class="login-box">
      <div class="text-center mb-2">
        <img routerLink="" src="/images/payiboxlogo2.png" alt="Payibox Logo" style="width: 90px;" class="gym-logo mb-1">
        <h1 class="h4 fw-bold text-light mb-0">Crear Cuenta</h1>
        <p class="small text-light">Únete a la comunidad de Payibox</p>
      </div>

      <form (ngSubmit)="onRegister()">
        <div class="row g-2 mb-2">
          <div class="col-6">
            <div class="form-group">
              <label class="form-label-compact">Nombre</label>
              <input type="text" name="first_name" [(ngModel)]="userData.first_name" class="form-control-custom"
                placeholder="Ej: Juan" required>
            </div>
          </div>
          <div class="col-6">
            <div class="form-group">
              <label class="form-label-compact">Apellido</label>
              <input type="text" name="last_name" [(ngModel)]="userData.last_name" class="form-control-custom"
                placeholder="Ej: Pérez" required>
            </div>
          </div>
        </div>

        <div class="form-group mb-2">
          <label class="form-label-compact">Correo electrónico</label>
          <input type="email" name="email" [(ngModel)]="userData.email" class="form-control-custom"
            placeholder="nombre@ejemplo.com" required>
        </div>

        <div class="form-group mb-2">
          <label class="form-label-compact">Contraseña</label>
          <input type="password" name="password" [(ngModel)]="userData.password" class="form-control-custom"
            placeholder="Mínimo 8 caracteres" required>
        </div>

        <div class="form-group mb-2">
          <label class="form-label-compact">Confirmar contraseña</label>
          <input type="password" name="confirmPassword" [(ngModel)]="userData.confirmPassword"
            class="form-control-custom" placeholder="Repite tu contraseña" required>
        </div>

        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="terms" required>
          <label class="form-check-label text-light small ms-1" for="terms">
            Acepto los <a href="#" class="link-muted underline">Términos</a>
          </label>
        </div>

        <button class="btn-primary-custom w-100 py-3" type="submit">
          Registrarme ahora
        </button>

        <div class="text-center mt-2">
          <p class="text-light small">
            ¿Ya tienes cuenta? <a routerLink="/login" class="link-muted ms-1">Inicia sesión</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
