<div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg fade-in">
      <div class="modal-body p-4">

        <div *ngIf="view === 'menu'" class="payment-options d-grid gap-3">
          <h5 class="fw-bold mb-3 text-center">Selecciona tu método de pago</h5>
          <button (click)="seleccionarMetodo('bancolombia')"
            class="btn btn-outline-primary p-3 d-flex justify-content-between">
            <span>Bancolombia</span> <i class="bi bi-bank"></i>
          </button>
          <button (click)="seleccionarMetodo('nacional')"
            class="btn btn-outline-success p-3 d-flex justify-content-between">
            <span>Transferencia Nacional</span> <i class="bi bi-credit-card"></i>
          </button>
          <button (click)="seleccionarMetodo('efectivo')"
            class="btn btn-outline-warning p-3 d-flex justify-content-between">
            <span>Efectivo</span> <i class="bi bi-cash"></i>
          </button>
        </div>

        <div *ngIf="view === 'transferencia'" class="fade-in">
          <h5 class="fw-bold text-uppercase mb-3">{{ selectedBank }}</h5>

          <div *ngIf="selectedBank !== 'efectivo'" class="card bg-light p-3 mb-3">
            <p><strong>Número:</strong> {{ cuentas[selectedBank]?.numero }}</p>
            <p><strong>Titular:</strong> {{ cuentas[selectedBank]?.titular }}</p>
          </div>

          <div class="mb-3">
            <label class="small fw-bold">Número de Orden:</label>
            <input type="text" [value]="orderNumber" readonly class="form-control bg-light">
          </div>

          <div class="mb-3">
            <label class="small fw-bold">Titular:</label>
            <input type="text" [value]="nombreTitular" readonly class="form-control bg-light">
          </div>

          <div *ngIf="selectedBank !== 'efectivo'" class="mb-3">
            <label class="small fw-bold">Comprobante:</label>
            <input type="file" (change)="onFileSelected($event)" class="form-control" accept="image/*">
          </div>

          <button (click)="procesarCompra()" class="btn btn-warning w-100 fw-bold">FINALIZAR COMPRA</button>
          <button (click)="volver()" class="btn btn-link w-100 text-dark">Volver</button>
        </div>

      </div>
    </div>
  </div>
</div>
