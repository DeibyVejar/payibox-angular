<div class="login-wrapper">
  <div class="login-container">
    <div class="login-box">
      <div class="text-center mb-4">
        <img routerLink="" src="/images/payiboxlogo2.png" alt="Payibox Logo" class="mb-3" style="width: 120px;">
        <h1 class="h3 fw-bold text-light">Iniciar Sesión</h1>
        <p class="text-light">Ingresa tus credenciales para acceder a Payibox</p>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group mb-3">
          <label for="floatingInput" class="form-label text-light">Correo electrónico</label>
          <input [(ngModel)]="credentials.email" name="email" type="email" class="form-control-custom"
            id="floatingInput" placeholder="nombre@ejemplo.com" required>
        </div>

        <div class="form-group mb-3">
          <label for="floatingPassword" class="form-label text-light">Contraseña</label>
          <input [(ngModel)]="credentials.password" name="password" type="password" class="form-control-custom"
            id="floatingPassword" placeholder="Tu contraseña" required>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault">
          <label class="form-check-label text-light" for="flexCheckDefault">
            Recordar mi cuenta
          </label>
        </div>

        <button class="btn-primary-custom w-100 py-3" type="submit">
          Acceder ahora
        </button>

        <div class="text-center mt-4">
          <a href="#" class="link-muted small">¿Olvidaste tu contraseña?</a>
          <span class="text-muted mx-2">|</span>
          <a routerLink="/register" class="link-muted small">Crear una cuenta nueva</a>
        </div>
      </form>
    </div>
  </div>
</div>
